name: Build torrent-list

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/torrent-list.yml'
      - 'files/add/add-torrent-list.txt'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: build-torrent-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p files/srs

      - name: Download latest sing-box binary
        shell: bash
        run: |
          set -euo pipefail

          LATEST_TAG=$(curl -fsSL \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | jq -er '.tag_name')

          VERSION="${LATEST_TAG#v}"
          ARCHIVE="sing-box-${VERSION}-linux-amd64.tar.gz"

          wget -q \
            "https://github.com/SagerNet/sing-box/releases/download/${LATEST_TAG}/${ARCHIVE}"

          tar -xzf "$ARCHIVE"

          sudo install \
            "sing-box-${VERSION}-linux-amd64/sing-box" \
            /usr/local/bin/sing-box

          sing-box version

      - name: Download and process sources
        shell: bash
        run: |
          set -euo pipefail

          SOURCES=(
            "https://raw.githubusercontent.com/Sn1pp1/mygeofiles/main/files/add/add-torrent-list.txt"
            "https://raw.githubusercontent.com/sakib-m/Pi-hole-Torrent-Blocklist/main/all-torrent-trackers.txt"
            "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/category-public-tracker.list"
            "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all_http.txt"
            "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all_https.txt"
            "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all_i2p.txt"
            "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all_udp.txt"
            "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all_ws.txt"
            "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all_yggdrasil.txt"
            "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_best.txt"
            "https://raw.githubusercontent.com/XIU2/TrackersListCollection/master/all.txt"
            "https://raw.githubusercontent.com/XIU2/TrackersListCollection/master/all_aria2.txt"
            "https://raw.githubusercontent.com/XIU2/TrackersListCollection/master/best.txt"
            "https://raw.githubusercontent.com/XIU2/TrackersListCollection/master/http.txt"
            "https://raw.githubusercontent.com/XIU2/TrackersListCollection/master/http_aria2.txt"
            "https://raw.githubusercontent.com/XIU2/TrackersListCollection/master/nohttp.txt"
            "https://raw.githubusercontent.com/XIU2/TrackersListCollection/master/nohttp_aria2.txt"
            "https://raw.githubusercontent.com/XIU2/TrackersListCollection/master/other.txt"
          )

          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT

          echo "========================================"
          echo "Downloading tracker sources"
          echo "========================================"

          SUCCESS=0
          FAILED=0
          INDEX=0

          for URL in "${SOURCES[@]}"; do
            NAME=$(basename "$URL")
            DEST="$TMP_DIR/$INDEX.txt"

            if curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 60 \
              "$URL" -o "$DEST" && [ -s "$DEST" ]; then

              LINES=$(wc -l < "$DEST")
              printf "  ✓ %-35s %6s lines\n" "$NAME" "$LINES"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "  ✗ Failed or empty: $URL"
              FAILED=$((FAILED + 1))
              rm -f "$DEST"
            fi

            INDEX=$((INDEX + 1))
          done

          echo ""
          echo "Downloaded: $SUCCESS"
          echo "Failed:     $FAILED"

          # Require a reasonable number of working sources.
          MIN_SUCCESS=5

          if [ "$SUCCESS" -lt "$MIN_SUCCESS" ]; then
            echo "ERROR: Too few sources available ($SUCCESS/$MIN_SUCCESS)"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "Normalizing and validating domains"
          echo "========================================"

          python3 - "$TMP_DIR" <<'PY'
          import sys
          import re
          import ipaddress
          from pathlib import Path
          from urllib.parse import urlsplit

          source_dir = Path(sys.argv[1])
          domains = set()

          total_lines = 0
          accepted_lines = 0
          duplicate_domains = 0
          invalid_lines = 0
          rejected = {}

          # Domains known to be unrelated to tracker infrastructure.
          # Keep this list conservative to avoid removing valid trackers.
          DENY_EXACT = {
              "docs.github.com",
              "www.2600.com",
              "www.proxmox.com",
              "dataforai.com",
              "elementsbrowser.com",
              "camera.lei001.com",
              "speedtest.iperson.xyz",
              "bms-hosxp.com",
              "commento.getblog.cn",
              "discover.curiousfacts.blog",
              "0123456789nonexistent.com",
          }

          # Common TLDs used to detect accidentally concatenated ports:
          # example.com80, tracker.net00, tracker.org80, etc.
          COMMON_SUFFIXES = (
              "com", "net", "org", "edu", "gov", "mil",
              "info", "biz", "name", "pro", "aero",
              "ru", "рф", "by", "ua", "kz", "cn",
              "de", "fr", "nl", "pl", "se", "no",
              "fi", "uk", "eu", "io", "me", "tv",
              "cc", "to", "xyz", "top", "club",
              "site", "online", "tech", "app",
          )

          def reject(reason):
              rejected[reason] = rejected.get(reason, 0) + 1
              return None

          def looks_like_port_corruption(host):
              """
              Detect likely damaged hostnames such as:
              tracker.example.com80

              Do not repair them automatically.
              """
              last_label = host.rsplit(".", 1)[-1]

              match = re.fullmatch(r"([a-z-]+)(\d{2,5})", last_label)
              if not match:
                  return False

              possible_tld = match.group(1)

              return possible_tld in COMMON_SUFFIXES

          def extract_domain(value):
              value = value.strip().lstrip("\ufeff")

              if not value:
                  return reject("empty")

              if value.startswith("@@"):
                  return reject("adguard_exception")

              # AdGuard domain rules.
              if value.startswith("||"):
                  value = value[2:].split("^")[0].split("$")[0]

              # Remove supported prefixes.
              prefixes = (
                  "+.",
                  "*.",
                  "domain:",
                  "full:",
                  "host:",
                  "suffix:",
                  "root:",
              )

              for prefix in prefixes:
                  if value.lower().startswith(prefix):
                      value = value[len(prefix):]
                      break

              value = value.strip().strip("\"'<>")

              if not value:
                  return reject("empty")

              # Remove common aria2 option prefix.
              if value.lower().startswith("--bt-tracker="):
                  value = value.split("=", 1)[1].strip()

              # Extract hostname from URL or host:port/path.
              try:
                  if "://" in value:
                      parsed = urlsplit(value)
                  else:
                      parsed = urlsplit("//" + value)

                  host = parsed.hostname or ""

                  # Accessing .port validates malformed ports.
                  port = parsed.port

                  if port is not None and not (1 <= port <= 65535):
                      return reject("invalid_port")

              except ValueError:
                  return reject("invalid_url_or_port")

              host = host.rstrip(".").lower()

              if not host:
                  return reject("no_hostname")

              # Reject IP addresses.
              try:
                  ipaddress.ip_address(host)
                  return reject("ip_address")
              except ValueError:
                  pass

              # Convert IDN to ASCII/Punycode.
              try:
                  host = host.encode("idna").decode("ascii")
              except UnicodeError:
                  return reject("invalid_idn")

              if len(host) > 253:
                  return reject("hostname_too_long")

              if "." not in host:
                  return reject("single_label")

              labels = host.split(".")

              for label in labels:
                  if not label:
                      return reject("empty_label")

                  if len(label) > 63:
                      return reject("label_too_long")

                  if not re.fullmatch(
                      r"[a-z0-9](?:[a-z0-9-]*[a-z0-9])?",
                      label
                  ):
                      return reject("invalid_label")

              # Numeric TLDs are not valid public domain suffixes.
              if labels[-1].isdigit():
                  return reject("numeric_tld")

              if looks_like_port_corruption(host):
                  return reject("suspected_port_corruption")

              if host in DENY_EXACT:
                  return reject("known_unrelated_domain")

              return host

          def parse_line(line):
              line = line.strip().lstrip("\ufeff")

              if not line:
                  return [], "empty"

              # Full-line comments.
              if line.startswith(("#", "!", ";")):
                  return [], "comment"

              lower = line.lower()

              # Unsupported rule types.
              if lower.startswith((
                  "regexp:",
                  "include:",
                  "geosite:",
                  "domain-keyword,",
                  "domain-regex,",
                  "ip-cidr,",
                  "ip-cidr6,",
                  "ipcidr:",
                  "process-name,",
                  "geoip:",
                  "geosite,",
              )):
                  return [], "unsupported_rule"

              # Mihomo / Clash domain rules.
              if lower.startswith(("domain-suffix,", "domain,")):
                  parts = line.split(",")

                  if len(parts) >= 2:
                      domain = extract_domain(parts[1])
                      return ([domain], None) if domain else ([], "invalid")

                  return [], "invalid"

              # YAML / sing-box-like domain entries.
              if lower.startswith(("domain_suffix:", "domain:")):
                  value = line.split(":", 1)[1].strip()
                  domain = extract_domain(value)
                  return ([domain], None) if domain else ([], "invalid")

              # Hosts format: IP domain [aliases...]
              parts = line.split()

              if len(parts) >= 2:
                  try:
                      ipaddress.ip_address(parts[0])

                      result = []

                      for item in parts[1:]:
                          domain = extract_domain(item)
                          if domain:
                              result.append(domain)

                      return (result, None) if result else ([], "invalid")

                  except ValueError:
                      pass

              # YAML list entries.
              line = re.sub(r"^-\s*", "", line).strip()

              # Remove inline comments.
              line = re.split(r"\s+#|\s+//|\s+;", line, maxsplit=1)[0]
              line = line.strip()

              if not line:
                  return [], "empty"

              # Reject unsupported comma-based rules.
              if "," in line:
                  return [], "unsupported_rule"

              domain = extract_domain(line)

              return ([domain], None) if domain else ([], "invalid")

          files = sorted(
              source_dir.glob("*.txt"),
              key=lambda path: int(path.stem)
          )

          for file in files:
              before = 0
              added = 0
              duplicates = 0
              invalid = 0

              for line in file.read_text(
                  encoding="utf-8",
                  errors="ignore"
              ).splitlines():

                  before += 1
                  total_lines += 1

                  parsed, reason = parse_line(line)

                  if not parsed:
                      if reason not in ("empty", "comment"):
                          invalid += 1
                          invalid_lines += 1
                      continue

                  accepted_lines += 1

                  for domain in parsed:
                      if domain in domains:
                          duplicates += 1
                          duplicate_domains += 1
                      else:
                          domains.add(domain)
                          added += 1

              print(
                  f"  {file.name:<12} "
                  f"{before:>6} lines | "
                  f"{added:>6} new | "
                  f"{duplicates:>6} duplicates | "
                  f"{invalid:>6} invalid"
              )

          sorted_domains = sorted(domains)

          output = Path("files/torrent-list.txt")
          output.parent.mkdir(parents=True, exist_ok=True)

          if not sorted_domains:
              raise SystemExit("ERROR: No valid domains extracted!")

          output.write_text(
              "\n".join(sorted_domains) + "\n",
              encoding="utf-8"
          )

          print()
          print("========================================")
          print(f"Total input lines:  {total_lines}")
          print(f"Accepted lines:     {accepted_lines}")
          print(f"Invalid lines:      {invalid_lines}")
          print(f"Duplicate domains:  {duplicate_domains}")
          print(f"Unique domains:     {len(sorted_domains)}")
          print("========================================")

          if rejected:
              print()
              print("Rejection reasons:")

              for reason, count in sorted(
                  rejected.items(),
                  key=lambda item: (-item[1], item[0])
              ):
                  print(f"  {reason:<32} {count:>6}")

          # Prevent publishing an unexpectedly small list.
          MIN_DOMAINS = 100

          if len(sorted_domains) < MIN_DOMAINS:
              raise SystemExit(
                  f"ERROR: Too few domains "
                  f"({len(sorted_domains)}/{MIN_DOMAINS})"
              )
          PY

          if [ ! -s files/torrent-list.txt ]; then
            echo "ERROR: Output file is empty!"
            exit 1
          fi

          echo ""
          echo "First 20 domains:"
          head -20 files/torrent-list.txt

      - name: Convert to SRS format
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          domains = [
              line.strip()
              for line in Path("files/torrent-list.txt").read_text(
                  encoding="utf-8"
              ).splitlines()
              if line.strip()
          ]

          if not domains:
              raise SystemExit("ERROR: Empty domain list!")

          data = {
              "version": 1,
              "rules": [
                  {
                      "domain_suffix": domains
                  }
              ]
          }

          Path("/tmp/torrent-list.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print(f"Domains for SRS: {len(domains)}")
          PY

          sing-box rule-set compile \
            --output files/srs/torrent-list.srs \
            /tmp/torrent-list.json

          if [ ! -s files/srs/torrent-list.srs ]; then
            echo "ERROR: SRS compilation failed!"
            exit 1
          fi

          echo "SRS compiled successfully."

      - name: Commit and push result
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "torrent-list Bot"
          git config user.email "torrent-list-bot@github.com"

          git add \
            files/torrent-list.txt \
            files/srs/torrent-list.srs

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "🔄 Update torrent-list.txt and SRS ($(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M MSK'))"

          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Changes pushed successfully."
              exit 0
            fi

            echo "Push attempt $i failed."

            git rebase --abort 2>/dev/null || true

            if [ "$i" -lt 3 ]; then
              sleep $((RANDOM % 5 + 1))
            fi
          done

          echo "ERROR: Unable to push changes."
          exit 1
