name: Build direct-ip

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: 
      - '.github/workflows/direct-ip.yml'
      - 'files/add/add-direct-ip.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Download sing-box
        run: |
          SING_BOX_VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name')
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION#v}-linux-amd64.tar.gz" | tar xz -C /tmp
          mv /tmp/sing-box-${SING_BOX_VERSION#v}-linux-amd64/sing-box ./sing-box
          chmod +x ./sing-box

      - name: Fetch and process IP lists
        run: |
          set -euo pipefail
          mkdir -p files/srs
          TEMP_FILE=$(mktemp)
          trap "rm -f $TEMP_FILE" EXIT

          SOURCES=(
            "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/private.list"
            "https://github.com/Sn1pp1/mygeofiles/raw/refs/heads/main/files/add/add-direct-ip.txt"
          )

          TOTAL_BEFORE=0
          for url in "${SOURCES[@]}"; do
            SHORT_NAME=$(echo "$url" | sed 's|.*/\([^/]*/[^/]*\)$|\1|' | cut -c1-40)
            
            COUNT=$(curl -fsL --connect-timeout 10 --max-time 30 "$url" 2>/dev/null | awk '
              { gsub(/\r/, ""); sub(/^[[:space:]]+/, ""); sub(/[[:space:]]+$/, "") }
              /^[[:space:]]*$/ || /^[[:space:]]*#/ { next }
              {
                sub(/#.*$/, ""); sub(/[[:space:]]+$/, "")
                if ($0 ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\/[0-9]+$/) { split($0, p, "[./]"); if (p[5] >= 0 && p[5] <= 32) { c++; next } }
                if ($0 ~ /^([0-9a-fA-F:]+)\/[0-9]+$/) { split($0, p, "/"); if (p[2] >= 0 && p[2] <= 128) { c++; next } }
                if ($0 ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/) { c++; next }
              }
              END { print c+0 }
            ' 2>/dev/null) || COUNT=0
            
            curl -fsL --connect-timeout 10 --max-time 30 "$url" >> "$TEMP_FILE" 2>/dev/null || true
            echo "" >> "$TEMP_FILE"
            printf "  %-40s %6s\n" "$SHORT_NAME..." "$COUNT"
            TOTAL_BEFORE=$((TOTAL_BEFORE + COUNT))
          done

          awk '
            { gsub(/\r/, ""); sub(/^[[:space:]]+/, ""); sub(/[[:space:]]+$/, "") }
            /^[[:space:]]*$/ || /^[[:space:]]*#/ { next }
            {
              sub(/#.*$/, ""); sub(/[[:space:]]+$/, "")
              if ($0 ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\/[0-9]+$/) {
                split($0, p, "[./]"); if (p[5] >= 0 && p[5] <= 32) { print $0; next }
              }
              if ($0 ~ /^([0-9a-fA-F:]+)\/[0-9]+$/) {
                split($0, p, "/"); if (p[2] >= 0 && p[2] <= 128) { print tolower($0); next }
              }
              if ($0 ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/) { print $0 "/32"; next }
            }
          ' "$TEMP_FILE" | LC_ALL=C sort -u > files/direct-ip.txt

          if [ ! -s files/direct-ip.txt ]; then echo "❌ Error: File is empty"; exit 1; fi
          echo "✅ Total IP ranges: $(wc -l < files/direct-ip.txt | tr -d ' ')"

      - name: Generate JSON and Compile to .srs
        run: |
          TEMP_JSON=$(mktemp)
          trap "rm -f $TEMP_JSON" EXIT
          
          jq -R -s -c 'split("\n") | map(select(length > 0))' files/direct-ip.txt | \
            jq '{"version": 1, "rules": [{"ip_cidr": .}]}' > "$TEMP_JSON"

          ./sing-box rule-set compile "$TEMP_JSON" -o files/srs/direct-ip.srs
          
          if [ ! -f files/srs/direct-ip.srs ]; then echo "❌ Error: Compilation failed"; exit 1; fi
          echo "✅ SRS file created: $(du -h files/srs/direct-ip.srs | cut -f1)"

      - name: Commit and push changes
        run: |
          git config user.name "direct-ip Bot"
          git config user.email "direct-ip-bot@github.com"
          git pull --rebase origin main 2>/dev/null || true
          git add files/direct-ip.txt files/srs/direct-ip.srs
          if ! git diff --staged --quiet; then
            git commit -m "🔄 Update direct-ip.txt and SRS ($(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M MSK'))"
            for i in 1 2 3; do git push && break || { sleep $((RANDOM % 5 + 1)); git pull --rebase origin main; }; done
          fi
