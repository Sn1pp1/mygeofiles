name: Build wl-ip

on:
  schedule:
    # Запуск каждые 12 часов (в 00:00 и 12:00 по UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Возможность ручного запуска через вкладку Actions
  push:
    branches: [main]
    paths: ['.github/workflows/Build-wl-ip.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешение на коммит и пуш файлов обратно в репозиторий

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Download sing-box
        run: |
          # Получаем версию последнего релиза sing-box через jq (надежнее, чем grep+sed)
          SING_BOX_VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name')
          echo "Downloading sing-box version: $SING_BOX_VERSION"
          
          # Скачиваем и распаковываем бинарный файл для linux-amd64
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION#v}-linux-amd64.tar.gz" | tar xz -C /tmp
          mv /tmp/sing-box-${SING_BOX_VERSION#v}-linux-amd64/sing-box ./sing-box
          chmod +x ./sing-box
          ./sing-box version

      - name: Fetch and process IP lists
        run: |
          mkdir -p files/srs
          
          TEMP_FILE=$(mktemp)
          TEMP_CLEAN=$(mktemp)
          
          # Гарантированная очистка временных файлов при завершении (даже при ошибке)
          trap "rm -f $TEMP_FILE $TEMP_CLEAN" EXIT

          # === ИСТОЧНИКИ ДАННЫХ ===
          SOURCES=(
            "https://github.com/vahellame/russia-whitelist-geoip/raw/refs/heads/main/data/other"
            "https://github.com/vahellame/russia-whitelist-geoip/raw/refs/heads/main/data/private"
            "https://github.com/vahellame/russia-whitelist-geoip/raw/refs/heads/main/data/trash"
            "https://github.com/vahellame/russia-whitelist-geoip/raw/refs/heads/main/data/vk"
            "https://github.com/vahellame/russia-whitelist-geoip/raw/refs/heads/main/data/yandex"
          )

          echo "📥 Загрузка данных из источников..."
          for url in "${SOURCES[@]}"; do
            if ! curl -fsL --connect-timeout 10 --max-time 30 "$url" >> "$TEMP_FILE" 2>/dev/null; then
              echo "⚠️ Ошибка загрузки (возможно, 404 или таймаут): $url"
            fi
            # ПРИНУДИТЕЛЬНЫЙ перевод строки между файлами, чтобы они не склеивались!
            echo "" >> "$TEMP_FILE"
          done

          echo " Очистка, фильтрация и сортировка..."
          
          # Удаляем комментарии, пустые строки, обрезаем пробелы по краям
          sed -e 's/#.*//' -e '/^[[:space:]]*$/d' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' "$TEMP_FILE" > "$TEMP_CLEAN"
          
          # Создаем пустой файл, чтобы гарантировать существование
          > files/wl-ip.txt
          
          # Валидация IPv4 (|| true чтобы не падать если ничего не найдено)
          grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?$' "$TEMP_CLEAN" | sort -u >> files/wl-ip.txt || true
          
          # Валидация IPv6 (|| true чтобы не падать если ничего не найдено)
          grep -E '^[0-9a-fA-F:]+(/[0-9]{1,3})?$' "$TEMP_CLEAN" | sort -u >> files/wl-ip.txt || true

          TOTAL_IPS=$(wc -l < files/wl-ip.txt | tr -d ' ')
          echo "✅ Собрано уникальных IP и диапазонов: $TOTAL_IPS"
          
          # Проверяем, что список не пустой
          if [ "$TOTAL_IPS" -eq 0 ]; then
            echo "❌ Ошибка: список IP пустой после фильтрации"
            exit 1
          fi

      - name: Generate JSON and Compile to .srs
        run: |
          echo "⚙️ Генерация JSON и компиляция в бинарный формат..."
          
          # Генерируем JSON во временный файл
          TEMP_JSON=$(mktemp)
          trap "rm -f $TEMP_JSON" EXIT
          
          jq -R -s -c 'split("\n") | map(select(length > 0))' files/wl-ip.txt | \
            jq '{
              "version": 1,
              "rules": [
                {
                  "ip_cidr": .
                }
              ]
            }' > "$TEMP_JSON"

          # Компилируем .srs в папку files/srs/
          ./sing-box rule-set compile "$TEMP_JSON" -o files/srs/wl-ip.srs
          
          if [ -f files/srs/wl-ip.srs ]; then
            SRS_SIZE=$(du -h files/srs/wl-ip.srs | cut -f1)
            echo "✅ Файл wl-ip.srs успешно создан (Размер: $SRS_SIZE)"
          else
            echo "❌ Ошибка компиляции .srs"
            exit 1
          fi

      - name: Commit and push changes
        run: |
          git config user.name "wl-ip Bot"
          git config user.email "wl-ip-bot@github.com"
          
          # Синхронизируемся с удаленным репозиторием на случай параллельных изменений
          git pull --rebase origin main 2>/dev/null || true
          
          # Добавляем только .txt и .srs файлы
          git add files/wl-ip.txt files/srs/wl-ip.srs
          
          if git diff --staged --quiet; then
            echo "️ Нет изменений для коммита (списки не изменились)."
          else
            # Получаем текущее время по Москве (МСК)
            MSK_TIME=$(TZ='Europe/Moscow' date '+%Y-%m-%d %H:%M MSK')
            git commit -m "🔄 Update wl-ip.txt and SRS ($MSK_TIME)"
            
            # Надежный пуш с повторными попытками на случай конфликтов или сбоев сети
            for i in 1 2 3; do
              if git push; then
                echo "🚀 Изменения успешно отправлены в репозиторий!"
                break
              else
                echo "⚠️ Ошибка push, попытка $i/3. Делаем rebase и пробуем снова..."
                sleep $((RANDOM % 5 + 1))
                git pull --rebase origin main
              fi
            done
          fi
