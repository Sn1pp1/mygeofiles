name: Build ru-blocklist

on:
  push:
    branches: [main]
    paths: 
      - '.github/workflows/ru-blocklist.yml'
      - 'files/add/add-blocklist.txt'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create output directory
      run: mkdir -p files/srs

    - name: Download latest sing-box binary
      run: |
        LATEST_TAG=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name')
        wget -q "https://github.com/SagerNet/sing-box/releases/download/${LATEST_TAG}/sing-box-${LATEST_TAG#v}-linux-amd64.tar.gz"
        tar -xzf "sing-box-${LATEST_TAG#v}-linux-amd64.tar.gz"
        sudo mv "sing-box-${LATEST_TAG#v}-linux-amd64/sing-box" /usr/local/bin/
        chmod +x /usr/local/bin/sing-box
        sing-box version

    - name: Download & Process Sources
      run: |
        set -euo pipefail

        SOURCES=(
          "https://github.com/Sn1pp1/mygeofiles/raw/refs/heads/main/files/add/add-blocklist.txt"
          "https://github.com/1andrevich/Re-filter-lists/raw/refs/heads/main/community.lst"
          "https://community.antifilter.download/list/domains.lst"
          "https://github.com/itdoginfo/allow-domains/raw/refs/heads/main/Russia/inside-raw.lst"
          "https://github.com/hydraponique/roscomvpn-geosite/raw/refs/heads/master/data/category-geoblock-ru"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-anticensorship.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/openai.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/anthropic.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/youtube.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/netflix.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/spotify.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/discord.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/telegram.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/whatsapp.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/instagram.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/facebook.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/meta.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/x.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/twitter.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/tiktok.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/reddit.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/google-deepmind.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/google-play.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/github.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/kinopub.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/hdrezka.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/anime.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/rutracker.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/curseforge.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/remnawave.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/speedtest.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-remote-control.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/pornhub.list"
        )

        TEMP_RAW=$(mktemp)
        TEMP_CLEAN=$(mktemp)
        trap "rm -f $TEMP_RAW $TEMP_CLEAN" EXIT

        TOTAL_BEFORE=0

        for URL in "${SOURCES[@]}"; do
          SHORT_NAME=$(echo "$URL" | sed 's|.*/\([^/]*/[^/]*\)$|\1|' | cut -c1-40)

          COUNT=$(curl -fsSL --retry 3 --max-time 30 "$URL" 2>/dev/null | awk '
            { gsub(/\r/, ""); sub(/^[[:space:]]+/, ""); sub(/[[:space:]]+$/, "") }
            /^[[:space:]]*$/ || /^[[:space:]]*#/ || /^regexp:/ || /^include:/ { next }
            {
              sub(/^\+\./, ""); sub(/^domain:/, ""); sub(/^keyword:/, "")
              sub(/^full:/, ""); sub(/^host:/, ""); sub(/^suffix:/, "")
              sub(/^root:/, ""); sub(/^\./, ""); sub(/^DOMAIN,/, ""); sub(/^DOMAIN-SUFFIX,/, "")
              sub(/^DOMAIN-KEYWORD,/, ""); sub(/^GEOSITE,/, ""); sub(/^\*\./, "")
              sub(/\.$/, "")
              sub(/@.*$/, ""); sub(/[[:space:]].*$/, "")
              if ($0 == "" || $0 ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/ || $0 ~ /:/ || $0 ~ /\.\./ || length($0) > 253 || $0 ~ /[^a-zA-Z0-9._-]/) next
              if ($0 !~ /\./) {
                if ($0 != "ru" && $0 != "su" && $0 != "by" && $0 != "moscow" && $0 != "local" && $0 != "lan" && $0 != "localhost" && $0 != "internal" && $0 != "localdomain" && $0 != "example" && $0 != "invalid" && $0 != "test" && $0 !~ /^xn--/) next
              }
              c++
            }
            END { print c+0 }
          ' 2>/dev/null) || COUNT=0

          curl -fsSL --retry 3 --max-time 30 "$URL" >> "$TEMP_RAW" 2>/dev/null || true
          echo "" >> "$TEMP_RAW"
          printf "  %-40s %6s\n" "$SHORT_NAME..." "$COUNT"
          TOTAL_BEFORE=$((TOTAL_BEFORE + COUNT))
        done

        awk '
          { gsub(/\r/, ""); sub(/^[[:space:]]+/, ""); sub(/[[:space:]]+$/, "") }
          /^[[:space:]]*$/ || /^[[:space:]]*#/ || /^regexp:/ || /^include:/ { next }
          {
            sub(/^\+\./, ""); sub(/^domain:/, ""); sub(/^keyword:/, "")
            sub(/^full:/, ""); sub(/^host:/, ""); sub(/^suffix:/, "")
            sub(/^root:/, ""); sub(/^\./, ""); sub(/^DOMAIN,/, ""); sub(/^DOMAIN-SUFFIX,/, "")
            sub(/^DOMAIN-KEYWORD,/, ""); sub(/^GEOSITE,/, ""); sub(/^\*\./, "")
            sub(/\.$/, "")
            sub(/@.*$/, ""); sub(/[[:space:]].*$/, "")
            if ($0 == "" || $0 ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/ || $0 ~ /:/ || $0 ~ /\.\./ || length($0) > 253 || $0 ~ /[^a-zA-Z0-9._-]/) next
            if ($0 !~ /\./) {
              if ($0 != "ru" && $0 != "su" && $0 != "by" && $0 != "moscow" && $0 != "local" && $0 != "lan" && $0 != "localhost" && $0 != "internal" && $0 != "localdomain" && $0 != "example" && $0 != "invalid" && $0 != "test" && $0 !~ /^xn--/) next
            }
            print tolower($0)
          }
        ' "$TEMP_RAW" | LC_ALL=C sort -u > files/ru-blocklist.txt

        if [ ! -s files/ru-blocklist.txt ]; then echo "❌ Error: File is empty"; exit 1; fi
        
        AFTER_DEDUP=$(wc -l < files/ru-blocklist.txt | tr -d ' ')
        echo "✅ Total domains: $AFTER_DEDUP"

    - name: Convert to SRS format
      run: |
        domains=$(grep -v '^$' files/ru-blocklist.txt | jq -R -s 'split("\n") | map(select(length > 0))')
        echo "{\"version\":1,\"rules\":[{\"domain_suffix\":$domains}]}" | jq '.' > /tmp/ru-blocklist.json
        sing-box rule-set compile --output files/srs/ru-blocklist.srs /tmp/ru-blocklist.json

    - name: Commit and push result
      run: |
        git config user.name "ru-blocklist Bot"
        git config user.email "ru-blocklist-bot@github.com"
        git pull --rebase origin main 2>/dev/null || true
        git add files/ru-blocklist.txt files/srs/ru-blocklist.srs
        if ! git diff --staged --quiet; then
          git commit -m "🔄 Update ru-blocklist.txt and SRS ($(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M MSK'))"
          for i in 1 2 3; do git push && break || { sleep $((RANDOM % 5 + 1)); git pull --rebase origin main; }; done
        fi
