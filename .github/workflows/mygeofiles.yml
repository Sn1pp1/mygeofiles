name: Build mygeofiles

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

env:
  MAX_ARTIFACT_SIZE_MB: 50
  DOMAIN_LIST_VER: "latest"
  GEOIP_VER: "latest"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Get latest sing-box version
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "SING_BOX_VERSION=$LATEST_VERSION" >> $GITHUB_ENV

      - name: Install sing-box
        run: |
          SING_BOX_VERSION=${{ env.SING_BOX_VERSION }}
          FORMAT="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          if curl -sL --fail --connect-timeout 15 --retry 2 "$FORMAT" -o sing-box.tar.gz 2>/dev/null; then
            tar xzf sing-box.tar.gz
            SINGBOX_BIN=$(find . -name "sing-box" -type f 2>/dev/null | head -1)
            if [ -n "$SINGBOX_BIN" ]; then
              sudo cp "$SINGBOX_BIN" /usr/local/bin/sing-box && sudo chmod +x /usr/local/bin/sing-box
            else
              go install github.com/SagerNet/sing-box/cmd/sing-box@v${SING_BOX_VERSION}
              sudo ln -sf $(go env GOPATH)/bin/sing-box /usr/local/bin/sing-box
            fi
            rm -rf sing-box.tar.gz 2>/dev/null || true
          else
            go install github.com/SagerNet/sing-box/cmd/sing-box@v${SING_BOX_VERSION}
            sudo ln -sf $(go env GOPATH)/bin/sing-box /usr/local/bin/sing-box
          fi

      - name: Set build date
        run: |
          echo "BUILD_DATE=$(TZ=Europe/Moscow date '+%Y-%m-%d')" >> $GITHUB_ENV
          echo "BUILD_DATETIME=$(TZ=Europe/Moscow date '+%Y-%m-%d %H:%M MSK')" >> $GITHUB_ENV

      - name: Prepare Data
        run: |
          set -euo pipefail
          mkdir -p data/geosite data/geoip

          download_with_retry() {
            local url="$1" dest="$2" max=3
            for i in $(seq 1 $max); do
              if curl -sL --fail --connect-timeout 15 --retry 2 --retry-delay 2 "$url" -o "$dest"; then return 0; fi
              sleep $((i * 2))
            done
            return 1
          }

          declare -A GEOSITE=(
            ["private"]="https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/sing/geo/geosite/private.srs"
            ["ru-blocklist"]="https://github.com/Sn1pp1/mygeofiles/raw/refs/heads/main/files/ru-blocklist.txt"
          )
          declare -A GEOIP=(
            ["directip"]="https://github.com/Sn1pp1/mygeofiles/raw/refs/heads/main/files/directip.txt"
            ["ru-blocklist-ip"]="https://github.com/Sn1pp1/mygeofiles/raw/refs/heads/main/files/ru-blocklist-ip.txt"
          )

          cat << 'EOF' > parser.py
          import json, sys, os, re
          def extract(obj, target_type):
              res = []
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if target_type == 'geosite':
                          if k in ['domain_suffix', 'domain']: res.extend(v)
                          elif k == 'domain_keyword': res.extend(['keyword:' + x for x in v])
                          elif k == 'domain_regex':
                              for r in v:
                                  try: re.compile(r); res.append('regexp:' + r)
                                  except: continue
                          else: res.extend(extract(v, target_type))
                      elif target_type == 'geoip':
                          if k == 'ip_cidr': res.extend(v)
                          else: res.extend(extract(v, target_type))
              elif isinstance(obj, list):
                  for item in obj: res.extend(extract(item, target_type))
              return res
          try:
              target, filename = sys.argv[1], sys.argv[2]
              if not os.path.exists('temp.json'): sys.exit(0)
              with open('temp.json', 'r', encoding='utf-8') as f: data = json.load(f)
              results = list(set(filter(None, extract(data, target))))
              if results:
                  with open(f'data/{target}/{filename}', 'w', encoding='utf-8') as f_out:
                      f_out.write('\n'.join(results) + '\n')
          except Exception: pass
          EOF

          process_categories() {
            local target="$1"; shift; local -n cats=$1; local failed=0
            for name in "${!cats[@]}"; do
              local url="${cats[$name]}"
              [ -z "$url" ] && continue
              if ! download_with_retry "$url" "temp_file"; then failed=$((failed + 1)); continue; fi
              local ext="${url##*.}"
              local output_path="data/$target/$name"
              if [[ "$url" == *.srs ]]; then
                sing-box rule-set decompile "temp_file" -o "temp.json" 2>&1 || { failed=$((failed + 1)); continue; }
                python3 parser.py "$target" "$name" || failed=$((failed + 1))
              elif [[ "$ext" == "txt" || "$ext" == "lst" ]]; then
                grep -v '^#' "temp_file" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' > "$output_path" || true
              else
                mv "temp_file" "temp.json"
                python3 parser.py "$target" "$name" || failed=$((failed + 1))
              fi
              rm -f temp.json temp_file 2>/dev/null || true
            done
            return $failed
          }

          process_categories "geosite" GEOSITE || true
          process_categories "geoip" GEOIP || true

      - name: Validate and Cleanup
        run: |
          find data -type f -empty -delete
          [ -z "$(ls -A data/geosite 2>/dev/null)" ] && { echo "❌ Error: No geosite data"; exit 1; }
          echo "✅ Prepared $(ls -1 data/geosite 2>/dev/null | wc -l) geosite and $(ls -1 data/geoip 2>/dev/null | wc -l) geoip categories"

      - name: Clean and Normalize Domains
        run: |
          for file in data/geosite/*; do
            [ -f "$file" ] || continue
            tr -d '\r' < "$file" | awk '
              { gsub(/\r/, ""); sub(/^[[:space:]]+/, ""); sub(/[[:space:]]+$/, "") }
              /^[[:space:]]*$/ || /^[[:space:]]*#/ { next }
              {
                line = $0
                if (line ~ /^regexp:/ || line ~ /^domain_regex:/) { sub(/^domain_regex:/, "regexp:"); print line; next }
                if (line ~ /^keyword:/ || line ~ /^domain_keyword:/) { sub(/^domain_keyword:/, "keyword:"); print line; next }
                if (line ~ /^full:/) { print line; next }

                sub(/^\+\./, ""); sub(/^domain:/, ""); sub(/^domain_suffix:/, "")
                sub(/^DOMAIN,/, ""); sub(/^DOMAIN-SUFFIX,/, ""); sub(/^DOMAIN-KEYWORD,/, ""); sub(/^GEOSITE,/, ""); sub(/^\*\./, "")
                
                sub(/\.$/, "")
                sub(/@.*$/, ""); sub(/[[:space:]].*$/, "")
                sub(/^[[:space:]\.]+/, "", line); sub(/[[:space:]\.]+$/, "", line)

                if (line == "" || line ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/ || line ~ /:/ || line ~ /\.\./ || length(line) > 253 || line ~ /[^a-zA-Z0-9._-]/) next
                
                if (line !~ /\./) {
                  if (line != "ru" && line != "su" && line != "by" && line != "moscow" && line != "local" && line != "lan" && line != "localhost" && line != "internal" && line != "localdomain" && line != "example" && line != "invalid" && line != "test" && line !~ /^xn--/) next
                }
                print tolower(line)
              }' | LC_ALL=C sort -u > "$file.cleaned"
            mv "$file.cleaned" "$file"
          done
          echo "✅ Domain normalization complete"

      - name: Pre-build validation
        run: |
          bad=0
          for file in data/geosite/*; do
            [ -f "$file" ] || continue
            invalid=$(grep -nE '^(full|keyword|domain|domain_suffix|domain_keyword|regexp):\.+' "$file" || true)
            if [ -n "$invalid" ]; then echo "❌ Invalid entries in $(basename "$file"):"; echo "$invalid" | head -5; bad=1; fi
          done
          [ "$bad" -eq 1 ] && exit 1
          echo "✅ All entries are valid"

      - name: Build geosite.dat
        run: |
          go run github.com/v2fly/domain-list-community@${{ env.DOMAIN_LIST_VER }} --datapath=data/geosite --outputname=geosite.dat
          [ ! -f geosite.dat ] && { echo "❌ geosite.dat not created"; exit 1; }
          echo "✅ geosite.dat created: $(du -h geosite.dat | cut -f1)"

      - name: Build geoip.dat
        run: |
          echo '{"input": [{"type": "text", "action": "add", "args": {"inputDir": "data/geoip"}}], "output": [{"type": "v2rayGeoIPDat", "action": "output", "args": {"outputDir": ".", "outputName": "geoip.dat"}}]}' > geoip_config.json
          go install github.com/v2fly/geoip@${{ env.GEOIP_VER }}
          $(go env GOPATH)/bin/geoip -c geoip_config.json
          echo "✅ geoip.dat created: $(du -h geoip.dat | cut -f1)"

      - name: Validate generated files
        run: |
          file geosite.dat | grep -q "data" || { echo "❌ geosite.dat corrupted"; exit 1; }
          file geoip.dat | grep -q "data" || { echo "❌ geoip.dat corrupted"; exit 1; }
          echo "✅ Files validated successfully"

      - name: Health check
        run: |
          geosite_size=$(stat -c%s geosite.dat 2>/dev/null || stat -f%z geosite.dat 2>/dev/null)
          geoip_size=$(stat -c%s geoip.dat 2>/dev/null || stat -f%z geoip.dat 2>/dev/null)
          [ "$geosite_size" -lt 1000 ] && { echo "❌ geosite.dat too small"; exit 1; }
          [ "$geoip_size" -lt 100 ] && { echo "❌ geoip.dat too small"; exit 1; }
          echo "✅ Health check passed"

      - name: Generate SHA256
        run: |
          sha256sum geosite.dat > geosite.dat.sha256
          sha256sum geoip.dat > geoip.dat.sha256

      - name: Generate changelog with statistics
        run: |
          {
            echo "## 🔄 Build #${{ github.run_number }}"
            echo "**🕒 Built:** ${{ env.BUILD_DATETIME }}"
            echo "**🔗 Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "### 📦 Contents"
            echo "- **Geosite categories:** $(ls -1 data/geosite 2>/dev/null | wc -l)"
            echo "- **Geoip categories:** $(ls -1 data/geoip 2>/dev/null | wc -l)"
            echo "- **geosite.dat:** $(du -h geosite.dat | cut -f1)"
            echo "- **geoip.dat:** $(du -h geoip.dat | cut -f1)"
            echo ""
            echo "### 📊 Geosite Statistics"
            echo "| Category | Entries |"
            echo "|----------|---------|"
            for f in data/geosite/*; do
              if [ -f "$f" ]; then
                name=$(basename "$f")
                count=$(wc -l < "$f" | tr -d ' ')
                echo "| \`$name\` | $count |"
              fi
            done
            echo ""
            echo "### 📊 Geoip Statistics"
            echo "| Category | Entries |"
            echo "|----------|---------|"
            for f in data/geoip/*; do
              if [ -f "$f" ]; then
                name=$(basename "$f")
                count=$(wc -l < "$f" | tr -d ' ')
                echo "| \`$name\` | $count |"
              fi
            done
            echo ""
            echo "### 🔐 Checksums"
            echo '```'
            cat geosite.dat.sha256 geoip.dat.sha256
            echo '```'
          } > changelog.md

      - name: Push Files to dat-files branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git switch --orphan dat-files
          git rm -r --cached . >/dev/null 2>&1 || true
          git add -f geosite.dat geoip.dat geosite.dat.sha256 geoip.dat.sha256
          git commit -m "🔄 Update dat files [Build #${{ github.run_number }}] - $(TZ=Europe/Moscow date '+%H:%M MSK')" || true
          git push origin dat-files --force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "🔄 Auto-build #${{ github.run_number }} (${{ env.BUILD_DATE }})"
          body_path: changelog.md
          make_latest: true
          files: |
            geosite.dat
            geoip.dat
            geosite.dat.sha256
            geoip.dat.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
