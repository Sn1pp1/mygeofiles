name: Build mygeofiles

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  MAX_ARTIFACT_SIZE_MB: 50
  DOMAIN_LIST_VER: "latest"
  GEOIP_VER: "latest"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Get latest sing-box version
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "SING_BOX_VERSION=$LATEST_VERSION" >> $GITHUB_ENV

      - name: Install sing-box
        run: |
          SING_BOX_VERSION=${{ env.SING_BOX_VERSION }}
          FORMAT="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          if curl -sL --fail --connect-timeout 15 --retry 2 "$FORMAT" -o sing-box.tar.gz 2>/dev/null; then
            tar xzf sing-box.tar.gz
            SINGBOX_BIN=$(find . -name "sing-box" -type f 2>/dev/null | head -1)
            if [ -n "$SINGBOX_BIN" ]; then
              sudo cp "$SINGBOX_BIN" /usr/local/bin/sing-box && sudo chmod +x /usr/local/bin/sing-box
            else
              go install github.com/SagerNet/sing-box/cmd/sing-box@v${SING_BOX_VERSION}
              sudo ln -sf $(go env GOPATH)/bin/sing-box /usr/local/bin/sing-box
            fi
            rm -rf sing-box.tar.gz 2>/dev/null || true
          else
            go install github.com/SagerNet/sing-box/cmd/sing-box@v${SING_BOX_VERSION}
            sudo ln -sf $(go env GOPATH)/bin/sing-box /usr/local/bin/sing-box
          fi

      - name: Set build date
        run: |
          echo "BUILD_DATE=$(TZ=Europe/Moscow date '+%Y-%m-%d')" >> $GITHUB_ENV
          echo "BUILD_DATETIME=$(TZ=Europe/Moscow date '+%Y-%m-%d %H:%M MSK')" >> $GITHUB_ENV

      - name: Prepare Data
        run: |
          set -euo pipefail
          mkdir -p data/geosite data/geoip

          download_with_retry() {
            local url="$1" dest="$2" max=3
            for i in $(seq 1 $max); do
              if curl -sL --fail --connect-timeout 15 --retry 2 --retry-delay 2 "$url" -o "$dest"; then return 0; fi
              sleep $((i * 2))
            done
            return 1
          }

          declare -A GEOSITE=(
            ["direct"]="https://github.com/Sn1pp1/mygeofiles/raw/refs/heads/main/files/direct.txt"
            ["ru-blocklist"]="https://github.com/Sn1pp1/mygeofiles/raw/refs/heads/main/files/ru-blocklist.txt"
          )
          declare -A GEOIP=(
            ["direct-ip"]="https://github.com/Sn1pp1/mygeofiles/raw/refs/heads/main/files/direct-ip.txt"
            ["ru-blocklist-ip"]="https://github.com/Sn1pp1/mygeofiles/raw/refs/heads/main/files/ru-blocklist
