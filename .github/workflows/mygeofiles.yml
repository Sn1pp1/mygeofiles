
name: Build mygeofiles

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOMAIN_LIST_VER: "latest"
  GEOIP_TAG: "202608050239"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      - name: Set build date
        shell: bash
        run: |
          echo "BUILD_DATE=$(TZ=Europe/Moscow date '+%Y-%m-%d')" >> "$GITHUB_ENV"
          echo "BUILD_DATETIME=$(TZ=Europe/Moscow date '+%Y-%m-%d %H:%M MSK')" >> "$GITHUB_ENV"

      - name: Prepare Data
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p data/geosite data/geoip

          download_with_retry() {
            local url="$1"
            local dest="$2"
            local tmp="${dest}.download"

            for attempt in 1 2 3; do
              if curl -fsSL \
                --connect-timeout 15 \
                --max-time 90 \
                --retry 1 \
                --retry-delay 2 \
                "$url" -o "$tmp"; then
                mv "$tmp" "$dest"
                return 0
              fi

              rm -f "$tmp"
              echo "Download attempt ${attempt}/3 failed: ${url}"
              sleep $((attempt * 2))
            done

            return 1
          }

          declare -A GEOSITE=(
            ["direct"]="https://raw.githubusercontent.com/Sn1pp1/mygeofiles/main/files/direct.txt"
            ["ru-blocklist"]="https://raw.githubusercontent.com/Sn1pp1/mygeofiles/main/files/ru-blocklist.txt"
          )

          declare -A GEOIP=(
            ["direct-ip"]="https://raw.githubusercontent.com/Sn1pp1/mygeofiles/main/files/direct-ip.txt"
            ["ru-blocklist-ip"]="https://raw.githubusercontent.com/Sn1pp1/mygeofiles/main/files/ru-blocklist-ip.txt"
          )

          process_categories() {
            local target="$1"
            local categories_name="$2"
            local failed=0
            local name url output_path tmp
            local -n categories="$categories_name"

            for name in "${!categories[@]}"; do
              url="${categories[$name]}"
              output_path="data/${target}/${name}"
              tmp="${RUNNER_TEMP}/${name}.txt"

              if ! download_with_retry "$url" "$tmp"; then
                echo "::error::Failed to download ${url}"
                failed=1
                continue
              fi

              tr -d '\r' < "$tmp" \
                | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' \
                > "$output_path"

              rm -f "$tmp"
              echo "Downloaded ${target}/${name}: $(wc -l < "$output_path" | tr -d ' ') lines"
            done

            return "$failed"
          }

          process_categories geosite GEOSITE
          process_categories geoip GEOIP

      - name: Validate downloaded data
        shell: bash
        run: |
          set -Eeuo pipefail

          for file in \
            data/geosite/direct \
            data/geosite/ru-blocklist \
            data/geoip/direct-ip \
            data/geoip/ru-blocklist-ip; do

            if [[ ! -s "$file" ]]; then
              echo "::error::Required input is missing or empty: $file"
              exit 1
            fi
          done

          echo "✅ All four input lists downloaded and are non-empty."

      - name: Clean and Normalize Domains
        shell: bash
        run: |
          set -Eeuo pipefail

          for file in data/geosite/*; do
            [[ -f "$file" ]] || continue

            awk '
              function trim(s) {
                sub(/^[[:space:]]+/, "", s)
                sub(/[[:space:]]+$/, "", s)
                return s
              }

              {
                line = $0
                gsub(/\r/, "", line)
                line = trim(line)

                if (line == "" || line ~ /^#/) next

                sub(/[[:space:]]+#.*$/, "", line)
                line = trim(line)

                if (line == "") next

                if (line ~ /^domain_regex:/)
                  sub(/^domain_regex:/, "regexp:", line)
                else if (line ~ /^DOMAIN-REGEX,/)
                  sub(/^DOMAIN-REGEX,/, "regexp:", line)

                if (line ~ /^domain_keyword:/)
                  sub(/^domain_keyword:/, "keyword:", line)
                else if (line ~ /^DOMAIN-KEYWORD,/)
                  sub(/^DOMAIN-KEYWORD,/, "keyword:", line)

                if (line ~ /^DOMAIN,/)
                  sub(/^DOMAIN,/, "full:", line)
                else if (line ~ /^DOMAIN-SUFFIX,/)
                  sub(/^DOMAIN-SUFFIX,/, "", line)

                if (line ~ /^GEOSITE,/) next

                if (line ~ /^(regexp|keyword|full):/) {
                  print tolower(line)
                  next
                }

                sub(/^domain_suffix:/, "", line)
                sub(/^domain:/, "", line)
                sub(/^\+\./, "", line)
                sub(/^\*\./, "", line)
                sub(/^\./, "", line)
                sub(/\.$/, "", line)
                sub(/@.*$/, "", line)
                sub(/[[:space:]].*$/, "", line)

                line = tolower(line)

                if (line == "") next
                if (line ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/) next
                if (line ~ /:/ || line ~ /\.\./ || length(line) > 253) next
                if (line ~ /[^a-z0-9._-]/) next

                if (line !~ /\./) {
                  if (line != "ru" &&
                      line != "su" &&
                      line != "by" &&
                      line != "moscow" &&
                      line != "local" &&
                      line != "lan" &&
                      line != "localhost" &&
                      line != "internal" &&
                      line != "localdomain" &&
                      line != "example" &&
                      line != "invalid" &&
                      line != "test" &&
                      line !~ /^xn--/) next
                }

                print line
              }
            ' "$file" | LC_ALL=C sort -u > "${file}.cleaned"

            mv "${file}.cleaned" "$file"

            echo "Normalized $(basename "$file"): $(wc -l < "$file" | tr -d ' ') entries"
          done

          echo "✅ Domain normalization complete."

      - name: Pre-build validation
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          import glob
          import re
          import sys

          bad = False
          pattern = re.compile(
              r"^(full|keyword|domain|domain_suffix|domain_keyword|regexp):\.\.+"
          )

          for path in glob.glob("data/geosite/*"):
              with open(path, "r", encoding="utf-8", errors="replace") as handle:
                  for number, raw_line in enumerate(handle, 1):
                      line = raw_line.strip()
                      if pattern.match(line):
                          print(
                              f"::error file={path},line={number}::"
                              f"Invalid entry: {line}"
                          )
                          bad = True

          if bad:
              sys.exit(1)

          print("✅ Domain input validation passed.")
          PY

      - name: Build geosite.dat
        shell: bash
        run: |
          set -Eeuo pipefail

          go run "github.com/v2fly/domain-list-community@${DOMAIN_LIST_VER}" \
            --datapath=data/geosite \
            --outputname=geosite.dat

          if [[ ! -s geosite.dat ]]; then
            echo "::error::geosite.dat was not created or is empty."
            exit 1
          fi

          echo "✅ geosite.dat created: $(du -h geosite.dat | cut -f1)"

      - name: Build geoip.dat
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "🔍 Validating and cleaning IP lists..."

          python3 - <<'PY'
          import glob
          import ipaddress
          import os
          import sys

          total = 0

          for path in glob.glob("data/geoip/*"):
              if not os.path.isfile(path):
                  continue

              networks = set()

              with open(path, "r", encoding="utf-8", errors="replace") as handle:
                  for raw_line in handle:
                      line = raw_line.strip().lstrip("\ufeff")

                      if not line or line.startswith("#"):
                          continue

                      line = line.split("#", 1)[0].split("//", 1)[0].strip()

                      if not line:
                          continue

                      try:
                          network = ipaddress.ip_network(line, strict=False)
                      except ValueError:
                          print(
                              f"⚠️ {os.path.basename(path)}: "
                              f"ignoring invalid entry: {line}"
                          )
                          continue

                      # A /0 route matches every IP address and must not
                      # accidentally turn a category into a catch-all rule.
                      if network.prefixlen == 0:
                          print(
                              f"⚠️ {os.path.basename(path)}: "
                              f"skipping default route {network}"
                          )
                          continue

                      networks.add(str(network))

              if not networks:
                  print(
                      f"::error::{os.path.basename(path)} "
                      "has no valid IP networks after cleanup"
                  )
                  sys.exit(1)

              with open(path, "w", encoding="utf-8", newline="\n") as handle:
                  for network in sorted(networks):
                      handle.write(network + "\n")

              total += len(networks)
              print(
                  f"✅ {os.path.basename(path)}: "
                  f"{len(networks)} unique networks"
              )

          if total == 0:
              print("::error::No valid IP networks remain.")
              sys.exit(1)
          PY

          echo "🔧 Downloading pinned GeoIP compiler source (${GEOIP_TAG})..."

          GEOIP_SOURCE="${RUNNER_TEMP}/v2fly-geoip"
          rm -rf "$GEOIP_SOURCE"

          git clone --depth 1 --branch "$GEOIP_TAG" \
            https://github.com/v2fly/geoip.git "$GEOIP_SOURCE"

          echo "🔨 Building the pinned GeoIP compiler..."

          (
            cd "$GEOIP_SOURCE"
            go build -trimpath -o "$GITHUB_WORKSPACE/geoip-compiler" .
          )

          cat > geoip_config.json <<'JSON'
          {
            "input": [
              {
                "type": "text",
                "action": "add",
                "args": {
                  "inputDir": "data/geoip"
                }
              }
            ],
            "output": [
              {
                "type": "v2rayGeoIPDat",
                "action": "output",
                "args": {
                  "outputDir": ".",
                  "outputName": "geoip.dat"
                }
              }
            ]
          }
          JSON

          ./geoip-compiler -c geoip_config.json

          if [[ ! -s geoip.dat ]]; then
            echo "::error::geoip.dat was not created or is empty."
            exit 1
          fi

          echo "✅ geoip.dat created: $(du -h geoip.dat | cut -f1)"

      - name: Validate generated files
        shell: bash
        run: |
          set -Eeuo pipefail

          for file in geosite.dat geoip.dat; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Generated file is missing or empty: $file"
              exit 1
            fi

            file "$file"
          done

          echo "✅ Generated files exist and are non-empty."

      - name: Health check
        shell: bash
        run: |
          set -Eeuo pipefail

          geosite_size=$(stat -c%s geosite.dat)
          geoip_size=$(stat -c%s geoip.dat)

          if (( geosite_size < 1000 )); then
            echo "::error::geosite.dat is too small (${geosite_size} bytes)."
            exit 1
          fi

          if (( geoip_size < 100 )); then
            echo "::error::geoip.dat is too small (${geoip_size} bytes)."
            exit 1
          fi

          echo "✅ Health check passed: geosite=${geosite_size} bytes, geoip=${geoip_size} bytes."

      - name: Generate SHA256
        shell: bash
        run: |
          set -Eeuo pipefail

          sha256sum geosite.dat > geosite.dat.sha256
          sha256sum geoip.dat > geoip.dat.sha256

      - name: Generate changelog with statistics
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "## 🔄 Build #${GITHUB_RUN_NUMBER}"
            echo "**🕒 Built:** ${BUILD_DATETIME}"
            echo "**🔗 Run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "### Contents"
            echo "- **Geosite categories:** $(find data/geosite -maxdepth 1 -type f | wc -l | tr -d ' ')"
            echo "- **GeoIP categories:** $(find data/geoip -maxdepth 1 -type f | wc -l | tr -d ' ')"
            echo "- **geosite.dat:** $(du -h geosite.dat | cut -f1)"
            echo "- **geoip.dat:** $(du -h geoip.dat | cut -f1)"
            echo
            echo "### Geosite Statistics"
            echo "| Category | Entries |"
            echo "|---|---:|"

            for file in data/geosite/*; do
              [[ -f "$file" ]] || continue
              printf '| `%s` | %s |\n' \
                "$(basename "$file")" \
                "$(wc -l < "$file" | tr -d ' ')"
            done

            echo
            echo "### GeoIP Statistics"
            echo "| Category | Networks |"
            echo "|---|---:|"

            for file in data/geoip/*; do
              [[ -f "$file" ]] || continue
              printf '| `%s` | %s |\n' \
                "$(basename "$file")" \
                "$(wc -l < "$file" | tr -d ' ')"
            done

            echo
            echo "### SHA256"
            echo '```text'
            cat geosite.dat.sha256 geoip.dat.sha256
            echo '```'
          } > changelog.md

      - name: Push Files to dat-files branch
        shell: bash
        run: |
          set -Eeuo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git switch --orphan dat-files
          git rm -r --cached . >/dev/null 2>&1 || true

          git add -f \
            geosite.dat \
            geoip.dat \
            geosite.dat.sha256 \
            geoip.dat.sha256

          git commit -m "Update dat files [Build #${GITHUB_RUN_NUMBER}] - $(TZ=Europe/Moscow date '+%H:%M MSK')"

          git push origin HEAD:dat-files --force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "🔄 Auto-build #${{ github.run_number }} (${{ env.BUILD_DATE }})"
          body_path: changelog.md
          make_latest: true
          files: |
            geosite.dat
            geoip.dat
            geosite.dat.sha256
            geoip.dat.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
