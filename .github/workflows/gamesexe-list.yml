name: Build gamesexe-list.json

on:
  push:
    branches: [main]
    paths:
      - 'files/gamesexe-list.txt'
      - '.github/workflows/gamesexe-list.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create output directory
      run: mkdir -p files/json

    - name: Process gamesexe-list.txt
      run: |
        set -euo pipefail

        SOURCE="files/gamesexe-list.txt"
        TEMP_CLEAN=$(mktemp)
        trap "rm -f $TEMP_CLEAN" EXIT

        if [ ! -s "$SOURCE" ]; then
          echo "❌ Ошибка: $SOURCE не найден или пустой!"
          exit 1
        fi

        echo "🧹 Парсинг и очистка..."

        # Парсинг через awk
        awk '
        { gsub(/\r/, ""); sub(/^[[:space:]]+/, ""); sub(/[[:space:]]+$/, "") }
        /^[[:space:]]*$/ { next }
        /^[[:space:]]*#/ { next }
        {
          d = tolower($0)
          if (d !~ /\.exe$/ && d !~ /\.des$/) next
          if (d ~ /[^a-zA-Z0-9._-]/) next
          print d
        }
        ' "$SOURCE" | LC_ALL=C sort -u > "$TEMP_CLEAN"

        BEFORE=$(wc -l < "$TEMP_CLEAN" | tr -d ' ')
        
        if [ "$BEFORE" -eq 0 ]; then
          echo "❌ Ошибка: После парсинга файл пустой!"
          exit 1
        fi

        echo "✅ Найдено $BEFORE уникальных процессов"
        echo ""
        echo "📊 Первые 10 процессов:"
        head -10 "$TEMP_CLEAN" | sed 's/^/   ✓ /'
        echo ""

        # === ГЕНЕРАЦИЯ JSON ЧЕРЕЗ PYTHON (heredoc) ===
        cat > /tmp/generate_json.py << 'PYEOF'
import json
import sys

input_file = sys.argv[1]
output_file = sys.argv[2]

processes = []
with open(input_file, 'r') as f:
    for line in f:
        line = line.strip()
        if line:
            processes.append(line)

data = {
    "version": 1,
    "rules": [
        {
            "process_name": processes
        }
    ]
}

with open(output_file, 'w') as f:
    json.dump(data, f, indent=2)

print(f"✅ JSON создан: {output_file}")
print(f"📦 Количество процессов: {len(processes)}")
PYEOF

        python3 /tmp/generate_json.py "$TEMP_CLEAN" files/json/gamesexe-list.json

        # Валидация JSON
        echo " Валидация JSON..."
        if ! python3 -m json.tool files/json/gamesexe-list.json > /dev/null 2>&1; then
          echo "❌ Ошибка: Невалидный JSON!"
          cat files/json/gamesexe-list.json
          exit 1
        fi

        JSON_SIZE=$(du -h files/json/gamesexe-list.json | cut -f1)
        echo "✅ Файл создан: files/json/gamesexe-list.json ($JSON_SIZE)"
        
        echo ""
        echo " Содержимое JSON (первые 20 строк):"
        head -20 files/json/gamesexe-list.json

    - name: Commit and push
      run: |
        git config user.name "gamesexe-list Bot"
        git config user.email "gamesexe-list-bot@github.com"

        git fetch origin main
        git reset --soft origin/main

        git add files/json/gamesexe-list.json

        if ! git diff --staged --quiet; then
          git commit -m "🔄 Update gamesexe-list.json ($(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M MSK'))"
          
          for i in 1 2 3; do
            if git push origin main; then
              echo "📤 Файл успешно обновлен"
              break
            else
              echo "⚠️ Push не удался, обновляем ветку (попытка $i)..."
              git fetch origin main
              git reset --soft origin/main
              git add files/json/gamesexe-list.json
              git commit -m "🔄 Update gamesexe-list.json ($(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M MSK'))"
              sleep 2
            fi
          done
        else
          echo "⏭️ Список не изменился, пропуск коммита"
        fi
