name: Build ru-list

on:
  push:
    branches: [main]
    paths: ['.github/workflows/Build-ru-list.yml']
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create output directory
      run: mkdir -p files/srs

    - name: Download latest sing-box binary
      run: |
        LATEST_TAG=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name')
        echo "Latest version: $LATEST_TAG"
        wget -q "https://github.com/SagerNet/sing-box/releases/download/${LATEST_TAG}/sing-box-${LATEST_TAG#v}-linux-amd64.tar.gz"
        tar -xzf "sing-box-${LATEST_TAG#v}-linux-amd64.tar.gz"
        sudo mv "sing-box-${LATEST_TAG#v}-linux-amd64/sing-box" /usr/local/bin/
        chmod +x /usr/local/bin/sing-box
        sing-box version

    - name: Download & Process Sources
      run: |
        set -euo pipefail

        SOURCES=(
          "https://github.com/Sn1pp1/mygeofiles/raw/refs/heads/main/files/wl.txt"
          "https://github.com/Davoyan/mihomo-rule-sets/raw/refs/heads/main/rules/category-ru.lst"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/2gis.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/autoru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/aviasales.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/avito.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/beget.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/betboom.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-ai-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-bank-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-betting-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-ecommerce-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-education-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-entertainment-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-forums-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-gov-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-media-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-medicine-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-retail-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-tech-media-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-travel-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/cdek.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/cian.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/comssone.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/genotek-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/gismeteo.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/headhunter.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/ideco-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/kaspersky.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/kinopoisk.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/kontur.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/magnit.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/mailru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/mailru-group.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/megafon.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/mosmetro.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/mts-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/mvideo.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/myoffice-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/nic-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/ok.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/okko.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/overclockers-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/ozon.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/regru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/rostelecom.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/rutube.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/sber.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/t2-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/tbank-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/tld-ru.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/vk.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/wildberries.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/wink.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/x5.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/yandex.list"
          "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/ucoz.list"
        )

        TEMP_RAW=$(mktemp)
        TEMP_CLEAN=$(mktemp)
        trap "rm -f $TEMP_RAW $TEMP_CLEAN" EXIT

        echo "📊 СТАТИСТИКА ЗАГРУЗКИ"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        TOTAL_BEFORE=0

        for URL in "${SOURCES[@]}"; do
          SHORT_NAME=$(echo "$URL" | sed 's|.*/\([^/]*/[^/]*\)$|\1|' | cut -c1-40)

          # Считаем строки с той же логикой, что и основной парсер
          COUNT=$(curl -fsSL --retry 3 --retry-delay 2 --max-time 30 "$URL" 2>/dev/null | awk '
          { gsub(/\r/, ""); sub(/^[[:space:]]+/, ""); sub(/[[:space:]]+$/, "") }
          /^[[:space:]]*$/ { next }
          /^[[:space:]]*#/ { next }
          /^regexp:/ { next }
          /^include:/ { next }
          {
            sub(/^\+\./, ""); sub(/^domain:/, ""); sub(/^keyword:/, "")
            sub(/^full:/, ""); sub(/^host:/, ""); sub(/^suffix:/, "")
            sub(/^root:/, ""); sub(/^\./, "")
          }
          /^[[:space:]]*$/ { next }
          /\.$/ { next }
          {
            d = $0
            sub(/@.*$/, "", d)
            sub(/[[:space:]].*$/, "", d)
            if (d == "") next
            if (d ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/) next
            if (d ~ /:/) next
            # Whitelist только известных российских TLD
            if (d !~ /\./) {
              if (d != "ru" && d != "su" && d != "by" && d != "moscow" && d !~ /^xn--/) next
            }
            if (d ~ /\.\./) next
            if (length(d) > 253) next
            if (d ~ /[^a-zA-Z0-9._-]/) next
            c++
          }
          END { print c+0 }
          ' 2>/dev/null) || COUNT=0

          curl -fsSL --retry 3 --retry-delay 2 --max-time 30 "$URL" >> "$TEMP_RAW" 2>/dev/null || true
          echo "" >> "$TEMP_RAW"

          printf "  %-40s %6s записей\n" "$SHORT_NAME..." "$COUNT"
          TOTAL_BEFORE=$((TOTAL_BEFORE + COUNT))
        done

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  ИТОГО скачано (до очистки):     $TOTAL_BEFORE записей"
        echo ""

        echo "🧹 Очистка и нормализация..."

        # === ОСНОВНОЙ ПАРСЕР ===
        awk '
        { gsub(/\r/, ""); sub(/^[[:space:]]+/, ""); sub(/[[:space:]]+$/, "") }
        /^[[:space:]]*$/ { next }
        /^[[:space:]]*#/ { next }
        /^regexp:/ { next }
        /^include:/ { next }
        {
          sub(/^\+\./, ""); sub(/^domain:/, ""); sub(/^keyword:/, "")
          sub(/^full:/, ""); sub(/^host:/, ""); sub(/^suffix:/, "")
          sub(/^root:/, ""); sub(/^\./, "")
        }
        /^[[:space:]]*$/ { next }
        /\.$/ { next }
        {
          d = $0

          sub(/@.*$/, "", d)
          sub(/[[:space:]].*$/, "", d)

          if (d == "") next
          if (d ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/) next
          if (d ~ /:/) next
          
          # === WHITELIST TLD: только ru, su, by, moscow и punycode (xn--*) ===
          if (d !~ /\./) {
            if (d != "ru" && d != "su" && d != "by" && d != "moscow" && d !~ /^xn--/) next
          }

          if (d ~ /\.\./) next
          if (length(d) > 253) next
          if (d ~ /[^a-zA-Z0-9._-]/) next

          print tolower(d)
        }
        ' "$TEMP_RAW" > "$TEMP_CLEAN"

        BEFORE_DEDUP=$(wc -l < "$TEMP_CLEAN" | tr -d ' ')

        echo " Сортировка и удаление дубликатов..."
        LC_ALL=C sort -u "$TEMP_CLEAN" > files/ru-list.txt

        if [ ! -s files/ru-list.txt ]; then
          echo "❌ Ошибка: Файл пустой после обработки!"
          exit 1
        fi

        AFTER_DEDUP=$(wc -l < files/ru-list.txt | tr -d ' ')
        REMOVED=$((BEFORE_DEDUP - AFTER_DEDUP))
        SIZE=$(du -h files/ru-list.txt | cut -f1)

        if [ "$BEFORE_DEDUP" -gt 0 ]; then
          PCT=$(awk "BEGIN {printf \"%.1f\", $REMOVED * 100 / $BEFORE_DEDUP}")
        else
          PCT="0.0"
        fi

        echo ""
        echo "📊 ИТОГОВАЯ СТАТИСТИКА"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        printf "  Записей после чистки:           %6s\n" "$BEFORE_DEDUP"
        printf "  Удалено дубликатов:             %6s (%s%%)\n" "$REMOVED" "$PCT"
        printf "  ✅ В итоговом файле:            %6s доменов\n" "$AFTER_DEDUP"
        printf "  Размер файла:                   %6s\n" "$SIZE"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        
        # Проверка TLD (с защитой от Broken pipe)
        echo "🔍 Найденные TLD в списке:"
        { grep -E '^(ru|su|by|moscow|xn--[a-z0-9]+)$' files/ru-list.txt || true; } | head -10 | sed 's/^/   ✓ TLD: /'
        echo ""
        echo " Первые 5 обычных доменов:"
        { grep '\.' files/ru-list.txt || true; } | head -5 | sed 's/^/   ✓ /'

    - name: Convert to SRS format
      run: |
        echo "🔄 Генерация SRS файла..."

        domains=$(grep -v '^$' files/ru-list.txt | jq -R -s 'split("\n") | map(select(length > 0))')
        echo "{\"version\":1,\"rules\":[{\"domain_suffix\":$domains}]}" | jq '.' > /tmp/ru-list.json

        sing-box rule-set compile --output files/srs/ru-list.srs /tmp/ru-list.json

        SRS_SIZE=$(du -h files/srs/ru-list.srs | cut -f1)
        echo "✅ SRS файл создан: files/srs/ru-list.srs ($SRS_SIZE)"

    - name: Commit and push result
      run: |
        git config user.name "ru-list Bot"
        git config user.email "ru-list-bot@github.com"

        git pull --rebase origin main 2>/dev/null || true

        if [ ! -f files/ru-list.txt ]; then
          echo "❌ Ошибка: файл ru-list.txt не найден!"
          exit 1
        fi

        git add files/ru-list.txt files/srs/ru-list.srs

        if ! git diff --staged --quiet; then
          git commit -m " Update ru-list.txt and SRS ($(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M MSK'))"
          for i in 1 2 3; do
            git push && break || { sleep $((RANDOM % 5 + 1)); git pull --rebase origin main; }
          done
          echo "📤 Файлы успешно обновлены"
        else
          echo "⏭️ Списки не изменились, пропуск коммита"
        fi
