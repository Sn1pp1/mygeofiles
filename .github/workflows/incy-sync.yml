name: incy config sync

on:
  workflow_run:
    workflows: ["Build mygeofiles"]
    types:
      - completed
  workflow_dispatch:

jobs:
  sync-config:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download latest .dat files from Releases
        run: |
          set -euo pipefail
          echo "📥 Скачиваем актуальные .dat файлы из Releases..."
          
          GEOIP_URL="https://github.com/Sn1pp1/mygeofiles/releases/download/latest/geoip.dat"
          GEOSITE_URL="https://github.com/Sn1pp1/mygeofiles/releases/download/latest/geosite.dat"
          
          for i in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 "$GEOIP_URL" -o geoip.dat && \
               curl -fsSL --retry 3 --retry-delay 2 "$GEOSITE_URL" -o geosite.dat; then
              echo "✅ Файлы скачаны успешно"
              break
            fi
            echo "⚠️ Попытка $i не удалась, повторяем..."
            sleep $((i * 2))
          done
          
          if [ ! -s geoip.dat ] || [ ! -s geosite.dat ]; then
            echo "❌ Ошибка: Не удалось скачать .dat файлы или они пустые!"
            exit 1
          fi
          
          echo "✅ Размеры файлов:"
          ls -lh geoip.dat geosite.dat

      - name: Calculate hashes and update JSON
        run: |
          set -euo pipefail
          
          # 1. Вычисляем SHA256 хэши
          GEOIP_HASH=$(sha256sum geoip.dat | awk '{print $1}')
          GEOSITE_HASH=$(sha256sum geosite.dat | awk '{print $1}')
          
          echo "🔐 Хэши:"
          echo "   geoip.dat:  $GEOIP_HASH"
          echo "   geosite.dat: $GEOSITE_HASH"

          # 2. Генерируем таймстампы
          TIMESTAMP=$(date +%s)
          TIMESTAMP_MS=$(date +%s%3N)

          # 3. Проверяем, что JSON существует
          if [ ! -f INCY/snp.json ]; then
            echo "❌ Ошибка: INCY/snp.json не найден!"
            exit 1
          fi

          # 4. Обновляем JSON через jq (атомарная замена)
          jq --arg gh "$GEOIP_HASH" \
             --arg sh "$GEOSITE_HASH" \
             --arg ts "$TIMESTAMP" \
             --arg ts_ms "$TIMESTAMP_MS" \
             '.GeoipHash = $gh | .GeositeHash = $sh | .LastUpdated = ($ts | tonumber) | .updatedAt = ($ts_ms | tonumber)' \
             INCY/snp.json > tmp.json
          
          mv tmp.json INCY/snp.json
          echo "✅ JSON обновлён"

      - name: Commit and Push changes to GitHub
        run: |
          set -euo pipefail
          
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add INCY/snp.json
          
          # Проверяем, изменился ли JSON
          if ! git diff-index --quiet HEAD; then
            git commit -m "🔄 Update INCY config ($(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M MSK'))"
            
            # Надежный push с retry и rebase
            for i in 1 2 3; do
              if git push origin main; then
                echo "📤 Изменения успешно отправлены в репозиторий!"
                break
              else
                echo "⚠️ Ошибка push, попытка $i/3. Делаем rebase и пробуем снова..."
                sleep $((RANDOM % 5 + 1))
                git pull --rebase origin main
              fi
            done
          else
            echo "⏭️ JSON не изменился, пропуск коммита"
          fi
