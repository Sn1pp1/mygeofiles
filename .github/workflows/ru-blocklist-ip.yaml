name: Build RU Blocklist IP

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: # Возможность ручного запуска через вкладку Actions
  push:
    branches: [main]
    paths: ['.github/workflows/Build-ru-blocklist-ip.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешение на коммит и пуш файлов обратно в репозиторий

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Download sing-box
        run: |
          # Получаем версию последнего релиза sing-box через jq (надежнее, чем grep+sed)
          SING_BOX_VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name')
          echo "Downloading sing-box version: $SING_BOX_VERSION"
          
          # Скачиваем и распаковываем бинарный файл для linux-amd64
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION#v}-linux-amd64.tar.gz" | tar xz -C /tmp
          mv /tmp/sing-box-${SING_BOX_VERSION#v}-linux-amd64/sing-box ./sing-box
          chmod +x ./sing-box
          ./sing-box version

      - name: Fetch and process IP lists
        run: |
          mkdir -p files/srs
          
          TEMP_FILE=$(mktemp)
          TEMP_CLEAN=$(mktemp)
          TEMP_JSON=$(mktemp)
          
          # Гарантированная очистка временных файлов при завершении (даже при ошибке)
          trap "rm -f $TEMP_FILE $TEMP_CLEAN $TEMP_JSON" EXIT

          # === ИСТОЧНИКИ ДАННЫХ ===
          SOURCES=(
            "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/telegram.list"
            "https://github.com/itdoginfo/allow-domains/raw/refs/heads/main/Subnets/IPv4/telegram.lst"
            "https://github.com/itdoginfo/allow-domains/raw/refs/heads/main/Subnets/IPv6/telegram.lst"
            "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/twitter.list"
            "https://github.com/itdoginfo/allow-domains/raw/refs/heads/main/Subnets/IPv4/twitter.lst"
            "https://github.com/itdoginfo/allow-domains/raw/refs/heads/main/Subnets/IPv6/twitter.lst"
            "https://github.com/itdoginfo/allow-domains/raw/refs/heads/main/Subnets/IPv4/meta.lst"
            "https://github.com/itdoginfo/allow-domains/raw/refs/heads/main/Subnets/IPv6/meta.lst"
            "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/facebook.list"
            "https://github.com/itdoginfo/allow-domains/raw/refs/heads/main/Subnets/IPv4/discord.lst"
            "https://github.com/itdoginfo/allow-domains/raw/refs/heads/main/Subnets/IPv6/discord.lst"
            "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/netflix.list"
          )

          echo "📥 Загрузка данных из источников..."
          for url in "${SOURCES[@]}"; do
            # Флаг -f заставляет curl возвращать ошибку при HTTP 404/500, чтобы HTML не попал в файл
            if ! curl -fsL --connect-timeout 10 --max-time 30 "$url" >> "$TEMP_FILE" 2>/dev/null; then
              echo "⚠️ Ошибка загрузки (возможно, 404 или таймаут): $url"
            fi
            # ПРИНУДИТЕЛЬНЫЙ перевод строки между файлами, чтобы они не склеивались!
            echo "" >> "$TEMP_FILE"
          done

          echo "🧹 Очистка, фильтрация и сортировка..."
          
          # Удаляем комментарии, пустые строки, строки без маски (/), обрезаем пробелы и приводим к нижнему регистру
          sed -e 's/#.*//' -e '/^[[:space:]]*$/d' -e '/\//!d' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' "$TEMP_FILE" | tr 'A-Z' 'a-z' > "$TEMP_CLEAN"
          
          # Создаем пустой файл, чтобы гарантировать его существование
          > files/ru-blocklist-ip.txt
          
          # Строгая валидация CIDR и раздельная сортировка (|| true предотвращает падение, если совпадений нет)
          # IPv4: x.x.x.x/y
          grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$' "$TEMP_CLEAN" | sort -u >> files/ru-blocklist-ip.txt || true
          
          # IPv6: hex:hex/y
          grep -E '^[0-9a-fA-F:]+/[0-9]{1,3}$' "$TEMP_CLEAN" | sort -u >> files/ru-blocklist-ip.txt || true

          TOTAL_IPS=$(wc -l < files/ru-blocklist-ip.txt | tr -d ' ')
          echo "✅ Собрано уникальных диапазонов: $TOTAL_IPS"
          
          # Проверяем, что список не пустой
          if [ "$TOTAL_IPS" -eq 0 ]; then
            echo "❌ Ошибка: список IP пустой после фильтрации"
            exit 1
          fi

      - name: Generate JSON and Compile to .srs
        run: |
          echo "⚙️ Генерация JSON и компиляция в бинарный формат..."
          
          # Генерируем JSON во временный файл (он будет удален trap-ом)
          jq -R -s -c 'split("\n") | map(select(length > 0))' files/ru-blocklist-ip.txt | \
            jq '{
              "version": 1,
              "rules": [
                {
                  "ip_cidr": .
                }
              ]
            }' > "$TEMP_JSON"

          # Компилируем .srs в папку files/srs/
          ./sing-box rule-set compile "$TEMP_JSON" -o files/srs/ru-blocklist-ip.srs
          
          if [ -f files/srs/ru-blocklist-ip.srs ]; then
            SRS_SIZE=$(du -h files/srs/ru-blocklist-ip.srs | cut -f1)
            echo "✅ Файл ru-blocklist-ip.srs успешно создан (Размер: $SRS_SIZE)"
          else
            echo "❌ Ошибка компиляции .srs"
            exit 1
          fi

      - name: Commit and push changes
        run: |
          git config user.name "RU Blocklist IP Bot"
          git config user.email "blocklist-ip-bot@github.com"
          
          # Синхронизируемся с удаленным репозиторием на случай параллельных изменений
          git pull --rebase origin main 2>/dev/null || true
          
          # Добавляем только .txt и .srs файлы
          git add files/ru-blocklist-ip.txt files/srs/ru-blocklist-ip.srs
          
          if git diff --staged --quiet; then
            echo "⏭️ Нет изменений для коммита (списки не изменились)."
          else
            # Получаем текущее время по Москве (МСК)
            MSK_TIME=$(TZ='Europe/Moscow' date '+%Y-%m-%d %H:%M MSK')
            git commit -m "🔄 Update ru-blocklist-ip.txt and SRS ($MSK_TIME)"
            
            # Надежный пуш с повторными попытками на случай конфликтов или сбоев сети
            for i in 1 2 3; do
              if git push; then
                echo "🚀 Изменения успешно отправлены в репозиторий!"
                break
              else
                echo "⚠️ Ошибка push, попытка $i/3. Делаем rebase и пробуем снова..."
                sleep $((RANDOM % 5 + 1))
                git pull --rebase origin main
              fi
            done
          fi
